<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#247d3f">
<!-- 아이콘을 파일이 아니라 주소 안에 그려 넣는다 — 외부 파일 0개 원칙을 지키면서
     북마크·홈 화면에 빈 칸이 뜨는 걸 막는다 (favicon이 없으면 404도 한 번 난다) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ffffff' stroke='%2316301f' stroke-width='3'/><path d='M16 7l7.1 5.2-2.7 8.4h-8.8L9 12.2z' fill='%2316301f'/></svg>">
<title>승부차기</title>
<style>
/* ===== 색상 토큰 ===== */
:root{
  --grass:#2e9e4f;
  --grass2:#288c46;
  --sky:#8ad8f6;
  --sky2:#bfeaff;
  /* 흰 글씨를 얹는 색이다. 밝으면 글씨가 묻힌다 —
     분홍은 #ff5fa2에서 대비 2.83:1로 기준(큰 글씨 3:1)에도 못 미쳤고,
     빨강은 #ef4444에서 3.76:1이라 17px 흰 글씨("정말 지울까요?")와
     흰 카드 위 빨강 안내문 둘 다 모자랐다. 둘 다 4.5:1을 넘기게 내렸다.
     밝은 분홍이 필요한 곳(색종이, 분홍 유니폼)은 이 토큰을 안 쓴다 */
  --pink:#e60067;     /* 흰 글씨와 4.6:1 */
  --yellow:#ffd93d;
  --red:#dc2626;      /* 흰 글씨와, 흰 바탕 위 글씨로도 4.8:1 */
  --ink:#10231a;
  --card:#ffffff;
  --line:rgba(16,35,26,.12);
  --shadow:0 6px 0 rgba(0,0,0,.18);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  background:var(--grass2);
  color:var(--ink);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  max-width:560px;
  margin:0 auto;
  overflow:hidden;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--sky2) 0%,var(--sky) 35%,var(--grass) 35%,var(--grass2) 100%);
}
.screen.on{display:flex}

/* ===== 공통 버튼 ===== */
button{
  font:inherit;
  font-weight:800;
  border:none;
  border-radius:16px;
  touch-action:manipulation;
  cursor:pointer;
}
.bigbtn{
  width:100%;
  min-height:64px;
  font-size:21px;
  color:#fff;
  background:var(--pink);
  box-shadow:var(--shadow);
  transition:transform .06s;
}
.bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bigbtn[disabled]{background:#b9c2bd;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.bigbtn.alt{background:#2f7cf6}
.bigbtn.ghost{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.bigbtn.danger{background:var(--red);color:#fff;font-size:17px}
/* 오늘 치를 경기를 다 썼을 때 — 눌러보기 전에 알 수 있어야 한다 */
.bigbtn.spent{background:#aab5ae;box-shadow:0 6px 0 rgba(0,0,0,.1)}

/* 경기 중 그만두기 — 눈에는 띄되 주 조작을 가리지 않게 */
.quitbtn{
  position:absolute;
  top:calc(8px + env(safe-area-inset-top));left:10px;
  width:48px;height:48px;border-radius:16px;
  background:rgba(255,255,255,.85);color:var(--ink);
  font-size:19px;z-index:10;
  box-shadow:0 3px 0 rgba(0,0,0,.12);
}
.quitlink{
  min-height:48px;padding:0 20px;margin-top:16px;
  background:transparent;color:#eaf4ed;font-size:15px;font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,.45);
  text-decoration:underline;
}

.modal{
  position:absolute;inset:0;z-index:60;
  display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(8,28,16,.78);
}
.modal.on{display:flex}
.modalbox{
  width:100%;max-width:320px;padding:22px;
  background:var(--card);border-radius:24px;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.25);
}
.modalicon{font-size:46px;line-height:1}
.modalbox h3{margin:8px 0 6px;font-size:21px}
.modalbox p{margin:0 0 20px;font-size:14px;color:#5e6f65;line-height:1.6}
.modalbox .bigbtn{margin-bottom:10px}
.modalbox .bigbtn:last-child{margin-bottom:0}
.minibtn{
  min-height:48px;padding:0 16px;font-size:15px;
  background:rgba(255,255,255,.9);color:var(--ink);
  box-shadow:0 4px 0 rgba(0,0,0,.12);
}

/* ===== 홈 ===== */
/* 제목은 연한 하늘 위에 놓인다 — 흰 글씨로는 대비가 모자란다 */
.title{
  text-align:center;
  margin:10px 0 4px;
  font-size:30px;
  font-weight:900;
  color:#14402a;
  text-shadow:0 2px 0 rgba(255,255,255,.55);
  letter-spacing:-1px;
}
.subtitle{text-align:center;color:#2e5c44;font-size:13px;margin-bottom:4px}
.homeball{
  width:64px;height:64px;margin:2px auto 10px;
  flex:0 0 auto;   /* 작은 화면에서 세로로 눌리면 타원이 된다 */
  border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff 0 46%,#eef2ef 47% 100%);
  border:3px solid #16301f;
  position:relative;
  animation:bob 1.6s ease-in-out infinite;
}
.homeball::before{
  content:"";position:absolute;inset:28% 30%;
  background:#16301f;
  clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%);
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}

/* 홈 화면 에너지 — 오늘 몇 판 남았는지 들어오자마자 보여야 한다.
   배경은 완전 불투명이어야 한다. 반투명이면 하늘/잔디 경계선이 카드를 가로지른다. */
.energybar{display:none;margin:0 0 12px}
.energybar.on{display:block;background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.erow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ename{font-weight:800;font-size:15px}
.ebig{font-size:28px;font-weight:900;color:var(--grass);letter-spacing:-1px}
.ebig.out{color:var(--red)}
.epip{font-size:20px;letter-spacing:4px;text-align:center;margin-top:4px}
.enote{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:13px;color:#6b7d72;text-align:center}

#s-home{overflow-y:auto}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:4px}
/* 기록과 규칙은 한 줄에 나란히 둔다 — 세로 자리를 하나도 더 안 쓰면서
   규칙에 큰 버튼을 줄 수 있다. 아래 토글 줄에 넣었더니 320px에서 네 번째가
   다음 줄로 밀려 화면 밖으로 나갔다 */
.menurow{display:flex;gap:12px}
.menurow .bigbtn{flex:1;font-size:19px}
/* 좁은 폰(320px)에서는 셋이 한 줄에 안 들어가 글자가 잘렸다.
   줄을 바꾸게 둔다 — 잘리는 것보다 두 줄이 낫다. 360px 이상은 그대로 한 줄이다 */
.toggles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:auto;padding-top:14px}
.toggles .minibtn{flex:1 1 auto;white-space:nowrap;padding:0 10px;font-size:14px}
.toggles .minibtn.off{opacity:.5}

/* 방 코드 — 말로 불러줄 숫자다. 멀리서도 읽혀야 한다 */
.roomcode{
  font-size:60px;font-weight:900;letter-spacing:10px;color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.25);margin-bottom:10px;
}
.roomwait{font-size:13px;color:#2e5c44;background:rgba(255,255,255,.85);
  border-radius:12px;padding:8px 12px;margin-top:14px;text-align:center;line-height:1.6}

/* ===== 설정 화면 ===== */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{
  background:var(--card);
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.card h3{margin:0 0 12px;font-size:17px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.row label{font-size:14px;font-weight:700;min-width:52px}
input[type=text],input[type=number]{
  flex:1;min-height:48px;padding:0 14px;font:inherit;font-size:16px;
  border:2px solid var(--line);border-radius:14px;background:#f7faf8;
}
input:focus{outline:none;border-color:var(--pink)}
.cardnote{font-size:14px;color:#5e6f65;line-height:1.6;margin-bottom:12px}
.cardnote b{color:var(--ink)}
.cardnote.empty{color:var(--red);font-weight:800}

/* 비밀번호 입력 */
.pinwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pinmsg{color:#fff;font-weight:800;font-size:17px;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.2);margin-bottom:18px;line-height:1.6}
.pindots{display:flex;gap:14px;margin-bottom:26px}
.pindot{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid #fff}
.pindot.on{background:#fff}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:300px}
.pinkey{
  min-height:60px;font-size:24px;font-weight:900;border-radius:18px;
  background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.15);
}
.pinkey:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.pinkey.blank{background:transparent;box-shadow:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{
  width:48px;height:48px;border-radius:14px;border:3px solid transparent;
  box-shadow:0 3px 0 rgba(0,0,0,.15), inset 0 0 0 1px rgba(16,35,26,.25);
}
.sw.sel{border-color:var(--ink);transform:scale(1.06)}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hdr .minibtn{min-height:44px}
.hdr h2{margin:0;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}

/* ===== 경기 화면 ===== */
#s-match{padding-left:12px;padding-right:12px}
.mhead{color:#fff;text-align:center;flex:0 0 auto}
.scoreline{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-weight:900;font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.2);
}
.scoreline .nm{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{
  min-width:38px;height:38px;line-height:38px;border-radius:12px;
  background:rgba(255,255,255,.95);color:var(--ink);font-size:21px;
}
.round{font-size:13px;opacity:.95;margin-top:4px}

/* 큰 폰에서는 골대 아래로 빈 잔디만 200px 넘게 남았고, 지시 문구가 골대에서
   300px 떨어져 눈이 한 번에 못 담았다. 남는 자리를 위아래로 나눠 골대를
   조작부 쪽으로 내린다. 짧은 화면은 남는 자리가 없어 지금과 똑같이 보인다.
   상한(340)은 올리지 않는다 — 키워봤더니 골대가 1.6:1로 퍼져 창문처럼 보이고
   골키퍼가 골라인 밖으로 넘쳤다. 가로는 어차피 화면 폭에 묶여 있어 같이 못 키운다. */
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding-top:6px}
/* aspect-ratio는 가로만 보고 세로를 안 봐서 짧은 화면에서 조작부를 덮었다.
   칸 위치는 전부 %라서 정사각형이 아니어도 배치는 그대로다. */
.goalwrap{position:relative;width:100%;max-width:340px;height:100%;max-height:340px}

.goal{
  position:absolute;left:0;right:0;top:4%;height:52%;
  border:7px solid #fff;border-bottom:none;border-radius:8px 8px 0 0;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 13px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 1px,transparent 1px 13px),
    rgba(0,0,0,.12);
  box-shadow:0 3px 0 rgba(0,0,0,.15);
}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.cell{
  border:2px dashed rgba(255,255,255,.4);
  border-radius:10px;margin:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:rgba(255,255,255,.55);font-weight:900;
  transition:background .12s,transform .12s;
}
/* 고를 수 있는 칸은 확실히 눈에 띄어야 한다 — 어린이가 보는 화면이다 */
.cells.live .cell{background:rgba(255,255,255,.26);border-style:solid;border-width:3px;border-color:#fff}
.cells.live .cell:active{background:var(--yellow);transform:scale(.95)}
.cell.picked{background:var(--yellow);border-color:#fff;color:var(--ink)}

.keeper{
  position:absolute;width:19%;height:34%;
  left:50%;top:46%;
  transform:translate(-50%,-50%);
  transition:left .32s cubic-bezier(.2,.7,.3,1.2),top .32s cubic-bezier(.2,.7,.3,1.2);
  z-index:3;
}
.keeper .head{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:52%;aspect-ratio:1;border-radius:50%;background:#ffd9b0;border:2px solid #16301f;
}
.keeper .body{
  position:absolute;left:50%;top:44%;transform:translateX(-50%);
  width:100%;height:56%;border-radius:10px 10px 6px 6px;
  background:#ff9d2e;border:2px solid #16301f;
}
.keeper .body::before,.keeper .body::after{
  content:"";position:absolute;top:6%;width:34%;height:30%;border-radius:6px;
  background:#ffe08a;border:2px solid #16301f;
}
.keeper .body::before{left:-34%;transform:rotate(-24deg)}
.keeper .body::after{right:-34%;transform:rotate(24deg)}
.keeper .num{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;letter-spacing:-1px;
}

.pitch{
  position:absolute;left:50%;top:88%;transform:translate(-50%,-50%);
  width:26px;height:9px;border-radius:50%;background:rgba(255,255,255,.45);
}
.ball{
  position:absolute;width:12%;aspect-ratio:1;
  left:50%;top:88%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff 0 46%,#eef2ef 47% 100%);
  border:2px solid #16301f;
  /* 골키퍼보다 위에 그려야 한다 — 안 그러면 막힌 건지 들어간 건지 안 보인다 */
  z-index:4;
}
.ball::before{
  content:"";position:absolute;inset:26% 28%;background:#16301f;
  clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%);
}
.ball.fly{transition:left .42s cubic-bezier(.3,.1,.5,1),top .42s cubic-bezier(.3,.1,.5,1),width .42s}

.verdict{
  position:absolute;left:0;right:0;top:34%;
  text-align:center;font-size:52px;font-weight:900;color:#fff;
  text-shadow:0 4px 0 rgba(0,0,0,.3);
  opacity:0;transform:scale(.5);pointer-events:none;z-index:5;
  letter-spacing:-2px;
}
.verdict.show{animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.verdict small{display:block;font-size:17px;letter-spacing:0;margin-top:2px;opacity:.95}

.shake{animation:shk .34s}
@keyframes shk{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(4px)}
}

/* ===== 하단 조작부 (화면 아래 1/3) ===== */
.panel{flex:0 0 auto;padding-top:8px}
.prompt{
  text-align:center;color:#fff;font-weight:900;font-size:19px;
  text-shadow:0 2px 0 rgba(0,0,0,.2);min-height:26px;
}
.hint{
  text-align:center;font-size:13px;font-weight:800;color:var(--ink);
  background:var(--yellow);border-radius:999px;
  padding:5px 10px;margin:6px auto 0;width:fit-content;
  visibility:hidden;
}
.hint.on{visibility:visible;animation:pop .3s}

.gaugewrap{margin:10px 0 8px;visibility:hidden}
.gaugewrap.on{visibility:visible}
.gauge{
  position:relative;height:30px;border-radius:999px;overflow:hidden;
  background:#e8efe9;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15);
}
/* 구간의 자리(left·width)는 CSS에 적지 않는다 — paintGauge()가 CFG에서 그린다.
   여기에 숫자를 박아두면 밸런스를 바꿨을 때 눈금만 옛말이 된다 */
.zone-weak{position:absolute;left:0;top:0;bottom:0;background:#aebfb4}
.zone-strong{position:absolute;top:0;bottom:0;background:var(--yellow)}
.zone-over{position:absolute;right:0;top:0;bottom:0;background:var(--red)}
.needle{position:absolute;top:-4px;bottom:-4px;width:8px;border-radius:4px;background:var(--ink);left:0}

/* 라벨은 자기 구간 바로 아래에 놓는다. 그냥 줄을 세우면 "강슛"이 바 한가운데에
   찍히는데 실제 강슛 구간은 오른쪽 끝이라, 아이가 가운데에 멈추는 법을 배운다.
   글자 색도 줄무늬와 맞춘다 — 같은 색이면 설명이 필요 없다 */
.gaugelab{
  position:relative;height:18px;margin-top:5px;
  font-size:13px;font-weight:800;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}
.gaugelab span{position:absolute;top:0;white-space:nowrap}
.gaugelab .l-weak{left:0;color:#d4e2d8}
.gaugelab .l-strong{transform:translateX(-50%);color:var(--yellow)}   /* left는 CFG에서 */
.gaugelab .l-over{right:0;color:#ffb4b4}

/* 누를 게 없을 때는 버튼을 내리고 안내만 남긴다.
   비활성 버튼을 가장 크게 두면 아이가 골대 대신 그걸 누른다. */
.actionhint{
  display:none;min-height:64px;
  align-items:center;justify-content:center;text-align:center;
  padding:0 14px;border-radius:16px;
  border:3px dashed rgba(255,255,255,.55);
  color:#fff;font-weight:800;font-size:17px;
  text-shadow:0 2px 0 rgba(0,0,0,.18);
}
.actionhint.on{display:flex}

.timer{text-align:center;color:#fff;font-weight:800;font-size:14px;min-height:20px;margin-top:6px;visibility:hidden}
.timer.on{visibility:visible}
.timer.warn{color:var(--yellow)}

/* ===== 규칙 화면 =====
   경기 화면에 쓰는 게이지를 그대로 가져다 쓴다 — 아이가 보는 것과 같아야
   설명이 설명이 된다. 다만 잔디 위에서 쓰던 색은 흰 카드에서 안 보인다 */
.card .gauge{border-color:#e3ebe6;box-shadow:none;height:26px}
.card .gaugelab{text-shadow:none}
/* 흰 바탕 위 13px 글씨라 4.5:1이 기준이다. 처음 넣은 값(#6b7d72 4.37,
   #a9780a 3.90)은 턱걸이로 모자랐다 — 줄무늬와 같은 색조는 그대로 두고 명도만 낮췄다 */
.card .gaugelab .l-weak{color:#5f7167}
.card .gaugelab .l-strong{color:#996c08}
.card .gaugelab .l-over{color:#cf2a2a}
.card .zone-weak{background:#c3d2c8}

/* 골대 6칸 — 🧤는 골키퍼가 가만히 서 있는 자리다 */
.minigoal{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
  gap:5px;height:92px;margin:2px 0 12px;padding:5px;
  border:5px solid #d7e0da;border-bottom:none;border-radius:8px 8px 0 0;
  background:rgba(16,35,26,.04);
}
.minigoal div{
  border:2px dashed #bccabf;border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-size:21px;
}
.rulelist{margin:0;padding-left:20px;font-size:14px;line-height:1.75;color:#3d4f45}
.rulelist li{margin-bottom:3px}
.rulelist b{color:var(--ink)}
.ruletip{
  margin-top:12px;padding:10px 12px;border-radius:14px;
  background:#fff7d6;font-size:14px;font-weight:700;line-height:1.6;color:#5a4a00;
}

/* ===== 폰 넘기기 ===== */
#s-handoff{
  background:#17331f;
  align-items:center;justify-content:center;text-align:center;
}
.hoff-icon{font-size:72px;margin-bottom:8px}
#s-handoff h2{color:#fff;font-size:27px;margin:0 0 6px}
#s-handoff p{color:#cfe6d6;font-size:15px;margin:0 0 28px;line-height:1.6}
#s-handoff .bigbtn{max-width:320px}

/* ===== 결과 ===== */
#s-result{align-items:center;justify-content:center;text-align:center}
.trophy{font-size:76px;animation:bob 1.6s ease-in-out infinite}
.winner{font-size:30px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);margin:6px 0 2px}
.finalscore{font-size:46px;font-weight:900;color:var(--yellow);text-shadow:0 3px 0 rgba(0,0,0,.25)}
/* "한 판 더"를 누르기 전에 몇 판 남았는지 알 수 있어야 한다 */
.resenergy{
  margin-top:14px;padding:12px 18px;border-radius:18px;
  background:rgba(255,255,255,.95);
  font-size:15px;font-weight:700;line-height:1.6;text-align:center;color:var(--ink);
}
.resenergy .pipline{font-size:20px;letter-spacing:4px;display:block;margin-bottom:4px}
.resbtns{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;margin-top:20px}

/* ===== 기록 ===== */
.rec{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.rec:last-child{border-bottom:none}
.rec b{font-size:17px}
.empty{text-align:center;color:#7b8a81;padding:22px 0;font-size:14px}

/* 색종이 */
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6}
.conf{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{
  from{transform:translateY(-30px) rotate(0)}
  to{transform:translateY(420px) rotate(540deg);opacity:0}
}

<script>
"use strict";

/* ============================================================
   설정값 — 밸런스는 전부 여기서 조정한다
   ============================================================ */
const CFG = {
  ROUNDS: 5,          // 한 라운드에 양쪽이 한 번씩 찬다 (각자 5번)
  POWER_OVER: 92,     // 초과하면 실축 (골대 넘김)
  POWER_STRONG: 72,   // 이상이면 강슛 — 읽혀도 뚫고, 옆칸 손끝도 지나간다
  POWER_WEAK: 50,     // 미만이면 약슛 — 옆칸 발끝에 확실히 걸린다
  REACH: 0.25,        // 보통 세기가 옆칸으로 뛴 골키퍼 손끝에 걸릴 확률. 이게 0이면
                      // "아무 데나 중간 세기"가 위험 0에 83%라 게이지가 장식이 된다
  GAUGE_MS: 1700,     // 게이지 한쪽 끝까지 가는 시간. 강슛 구간(72~92)이 340ms가 된다
  SUDDEN_MAX: 5,      // 서든데스 상한. 여기까지 동점이면 비긴 걸로 끝낸다
  PICK_SEC: 45,       // 선택 제한 시간
  TIMER_SHOW: 15,     // 남은 시간이 이 아래일 때만 타이머 노출 (압박 완화)

  // 에너지 — 하루에 할 수 있는 양을 게임이 스스로 제한한다.
  // 이 앱은 주인 한 명의 것이므로 에너지도 하나만 센다.
  // 게스트와 하든 혼자 하든 주인의 에너지가 줄어든다.
  ENERGY_MAX: 5,      // 하루에 치를 수 있는 경기 수
  ENERGY_HOUR: 15,    // 매일 이 시각(24시간제)에 가득 충전. 하교 후로 잡았다

  // 각자 폰으로 대결할 때 쪽지를 주고받는 자리 (기획서 8장).
  // Firebase Realtime Database, 싱가포르. 비우면 각자 폰 대결이 꺼진다
  LOCKER: "https://bro-soccer-default-rtdb.asia-southeast1.firebasedatabase.app"
};

/* 이 앱에는 선수 이름이 없다. 주인과 게스트, 로봇 세 역할뿐이다. */
const OWNER = "나", GUEST = "게스트", BOT = "로봇";
/* 각자 폰으로 할 때는 상대 폰에서도 자기가 "나"여야 한다.
   한 폰으로 번갈아 할 때는 지금처럼 "게스트"를 그대로 쓴다. */
const OPP = "상대";

const COLORS = [
  { id:"red",    name:"빨강", v:"#e53935" },
  { id:"blue",   name:"파랑", v:"#1e6fe0" },
  { id:"yellow", name:"노랑", v:"#f6c026" },
  { id:"green",  name:"초록", v:"#1f9d55" },
  { id:"purple", name:"보라", v:"#8b5cf6" },
  { id:"pink",   name:"분홍", v:"#ff5fa2" },
  { id:"gold",   name:"금색", v:"#d9a520" },
  { id:"white",  name:"하양", v:"#f4f6f5" }
];

// 골 세리머니 — 호날두의 "시우"를 좋아해서 넣었다
const CELEBRATIONS = [
  "시우~! 🙌",
  "호우! 🔥",
  "환상적이야! ⭐",
  "완벽한 슛! ✨",
  "골대가 울었다! 💥"
];

// 골대 6칸 — 0 1 2 / 3 4 5
const ADJACENT = {
  0:[1,3], 1:[0,2,4], 2:[1,5],
  3:[0,4], 4:[1,3,5], 5:[2,4]
};

/* ============================================================
   저장소
   ============================================================ */
const STORE_KEY = "brosoccer.v1";
let store = loadStore();
saveStore();          // 손본 모양을 바로 굳힌다

function loadStore(){
  let s = defaultStore();
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) s = Object.assign(s, JSON.parse(raw));
  }catch(e){ /* 저장소를 못 쓰는 환경이어도 게임은 돌아가야 한다 */ }
  return repairStore(s);
}

/* 폰에 남아 있는 저장본은 예전 버전이 쓴 것일 수 있다.
   Object.assign은 한 겹만 섞으므로 모양이 바뀐 중첩 객체는 옛것이 통째로 살아남는다.
   실제로 energy가 예전 모양이면 left가 없어 제한이 통째로 풀렸다 — 여기서 손본다. */
function repairStore(s){
  const d = defaultStore();
  const n = (v, fb) => (typeof v === "number" && isFinite(v)) ? v : fb;
  const str = (v, fb) => (typeof v === "string" && v) ? v : fb;

  if(!s.owner || typeof s.owner !== "object") s.owner = d.owner;
  s.owner.color = str(s.owner.color, d.owner.color);
  s.owner.num   = str(s.owner.num,   d.owner.num);
  s.guestColor  = str(s.guestColor,  d.guestColor);

  // 길이가 4가 아닌 비밀번호는 입력으로 맞출 수 없다 (4자리를 채워야 확인된다)
  s.pin = (typeof s.pin === "string" && s.pin.length === 4) ? s.pin : null;

  ["solo","guest"].forEach(k => {
    if(!s[k] || typeof s[k] !== "object") s[k] = d[k];
    s[k].w = n(s[k].w, 0); s[k].l = n(s[k].l, 0); s[k].d = n(s[k].d, 0);
  });
  s.solo.best = n(s.solo.best, 0);

  const e = (s.energy && typeof s.energy === "object") ? s.energy : d.energy;
  const refill = (typeof e.lastRefill === "string" && !isNaN(Date.parse(e.lastRefill)))
    ? e.lastRefill : null;
  s.energy = {   // 예전 모양의 남은 키까지 털어내고 새로 짓는다
    left: Math.max(0, Math.min(CFG.ENERGY_MAX, n(e.left, CFG.ENERGY_MAX))),
    lastRefill: refill
  };

  delete s.h2h; delete s.last;   // 예전 버전이 남긴 찌꺼기
  return s;
}
function defaultStore(){
  return {
    sound:true, vib:true,
    // 기본값은 흰 유니폼 7번 — 주인이 레알 마드리드와 호날두를 좋아한다
    owner:{ color:"white", num:"7" },
    guestColor:"purple",
    pin:null,                                  // 게스트 대결을 여는 4자리. 미설정이면 처음에 정한다
    solo:{ w:0, l:0, d:0, best:0 },             // 로봇 상대 전적
    guest:{ w:0, l:0, d:0 },                    // 게스트 상대 전적
    energy:{ left:CFG.ENERGY_MAX, lastRefill:null }
  };
}
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
}

/* ============================================================
   효과음 (코드로 생성 — 음원 파일 없음)
   ============================================================ */
let actx = null;
function audio(){
  if(!store.sound) return null;
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, dur, type, vol){
  const a = audio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || .18, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, vol){
  const a = audio(); if(!a) return;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain(); g.gain.value = vol || .15;
  src.connect(g); g.connect(a.destination); src.start();
}
const SFX = {
  tap:  ()=> tone(520, .06, "square", .08),
  kick: ()=> { noise(.12, .22); tone(130, .12, "triangle", .2); },

  save: ()=> { tone(90, .22, "square", .2); noise(.2, .18); },
  miss: ()=> { tone(300, .3, "sawtooth", .1); },
  whistle: ()=> { tone(1800, .18, "square", .09); setTimeout(()=>tone(2100,.22,"square",.09),120); }
};
function buzz(pattern){

/* ============================================================
   에너지

   하루치가 정해져 있고, 다 쓰면 내일 충전 시각까지 경기를 할 수 없다.
   실시간으로 조금씩 차오르게 만들지 않는다 — "찼나?" 하고 자꾸 열어보게 만드는
   장치이고, 기다리는 동안에도 게임이 아이 머릿속에 남는다.
   ============================================================ */

/* 주어진 시점 기준으로 가장 최근에 지나간 충전 시각 */
function refillPoint(d){
  const p = new Date(d);
  p.setHours(CFG.ENERGY_HOUR, 0, 0, 0);
  if(p > d) p.setDate(p.getDate() - 1);
  return p;
}

function syncEnergy(){
  if(!store.energy) store.energy = { left:CFG.ENERGY_MAX, lastRefill:null };
  const point = refillPoint(new Date());
  const last = store.energy.lastRefill ? new Date(store.energy.lastRefill) : null;
  // 시계를 과거로 돌리면 point가 last보다 작아져 충전되지 않는다
  if(!last || point > last){
    store.energy.left = CFG.ENERGY_MAX;
    store.energy.lastRefill = point.toISOString();
    saveStore();
  }
}

function energyLeft(){
  syncEnergy();
  return store.energy.left;
}

/* 경기 시작 시점에 깎는다. 중간에 그만둬도 돌려주지 않는다 —
   돌려주면 마음에 안 드는 판을 그만두고 다시 하는 게 공짜가 된다. */
function spendEnergy(){
  syncEnergy();
  store.energy.left = Math.max(0, store.energy.left - 1);
  saveStore();
}

function pips(left){
  return "⚽".repeat(left) + "○".repeat(Math.max(0, CFG.ENERGY_MAX - left));
}

/* "오후 3시" — 충전 시각 그 자체. 규칙 화면은 오늘/내일이 필요 없다 */
function refillLabel(){
  const h = CFG.ENERGY_HOUR;
  return (h < 12 ? "오전 " : "오후 ") + (h % 12 === 0 ? 12 : h % 12) + "시";
}
function refillWhen(){
  const now = new Date();
  const today = new Date(now);
  today.setHours(CFG.ENERGY_HOUR, 0, 0, 0);
  return (today > now ? "오늘 " : "내일 ") + refillLabel();
}

/* ============================================================
   한국어 조사 — "민준은(는)" 같은 표기는 쓰지 않는다
   ============================================================ */
function hasJong(s){
  if(!s) return false;
  const c = s.charCodeAt(s.length - 1);
  if(c < 0xAC00 || c > 0xD7A3) return false;   // 한글이 아니면 받침 없는 쪽으로
  return (c - 0xAC00) % 28 !== 0;
}
function josa(name, withJong, withoutJong){
  return name + (hasJong(name) ? withJong : withoutJong);
}

/* ============================================================
   화면 전환

const $ = id => document.getElementById(id);
function show(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("s-" + name).classList.add("on");
}

/* 화면 꺼짐 방지 — 상대를 기다리는 동안 꺼지면 흐름이 끊긴다.

   잠금을 달라고 해놓고 기다리는 사이에 경기가 끝나면, wakeLock이 아직 null이라
   끄려는 쪽이 할 일을 못 찾고 그냥 지나간다. 그 뒤에 잠금이 도착해 눌러앉으면
   홈 화면에서도 폰이 안 꺼진다 — 아이 폰 배터리가 그렇게 샌다.
   그래서 "지금 원하는 상태"를 따로 들고 있다가, 잠금이 도착했을 때 다시 본다. */
let wakeLock = null, wakeWanted = false, wakeBusy = false;
async function keepAwake(on){
  wakeWanted = on;
  if(wakeBusy) return;          // 요청이 날아가 있다. 그게 도착해서 정리한다
  try{
    if(on){
      if(wakeLock || !navigator.wakeLock) return;
      wakeBusy = true;
      const lock = await navigator.wakeLock.request("screen");
      wakeBusy = false;
      if(!wakeWanted){ lock.release(); return; }   // 기다리는 사이에 경기가 끝났다
      wakeLock = lock;
      lock.addEventListener("release", ()=>{ if(wakeLock === lock) wakeLock = null; });
    }else if(wakeLock){
      const lock = wakeLock;
      wakeLock = null;          // 먼저 지운다 — release가 다시 여기로 들어와도 꼬이지 않게
      lock.release();
    }
  }catch(e){ wakeBusy = false; }
}
document.addEventListener("visibilitychange", ()=>{
  // 알림 하나 보고 오면 45초가 그냥 흘러 자동 실축이 됐다
  if(document.visibilityState === "hidden"){ pauseTimer(); return; }
  if(!G.running) return;
  keepAwake(true);
  if(!$("quit-modal").classList.contains("on")) resumeTimer();
});

/* 경기 진행용 예약은 반드시 이걸로 건다.
   그냥 setTimeout을 쓰면 홈으로 나간 뒤에도 다음 턴이 깨어나 화면을 다시 뺏는다. */
function later(fn, ms){
  const id = setTimeout(() => {
    G.pending = G.pending.filter(x => x !== id);
    fn();
  }, ms);
  G.pending.push(id);
  return id;
}
function clearPending(){
  G.pending.forEach(clearTimeout);
  G.pending = [];
}

/* ============================================================
   사물함 — 두 폰이 쪽지를 넣었다 꺼내는 자리 (기획서 8장)

   지금은 Firebase Realtime Database다 (주소는 CFG.LOCKER 한 줄).
   **SDK는 쓰지 않는다** — REST(fetch)로 넣고 EventSource로 흘려받는다.
   둘 다 브라우저 기본 기능이라 외부 라이브러리가 0개로 유지된다.
   통신을 갈아끼울 자리는 openLocker() 이 함수 하나다.
   ============================================================ */
/* 이 폰을 가리키는 임시 이름. 내가 넣은 쪽지를 도로 꺼내지 않으려고 쓴다.
   사람을 가리키는 값이 아니고 경기가 끝나면 버린다 */
const ME = String(Math.random()).slice(2, 10);

function roomUrl(code){ return CFG.LOCKER + "/rooms/" + code + ".json"; }

/* 방 하나를 연다.
   - 넣기: 쪽지 하나를 POST 한다 (키는 서버가 시간순으로 붙여준다)
   - 꺼내기: EventSource로 흘려받는다. 브라우저 기본 기능이라 라이브러리가 없다 */
function openLocker(code, onNote, onBroken){
  const es = new EventSource(roomUrl(code));
  const take = raw => {
    if(!raw || typeof raw !== "object") return;
    if(raw.from === ME) return;          // 내가 넣은 쪽지다
    onNote(raw);
  };
  es.addEventListener("put", e => {
    let m;
    try{ m = JSON.parse(e.data); }catch(err){ return; }
    if(m.path === "/"){
      // 들어오면서 한 번. 끊겼다 다시 붙을 때도 이 길로 "방에 있는 전부"가 또 온다 —
      // 받는 쪽은 같은 쪽지를 두 번 받아도 괜찮아야 한다
      if(m.data) Object.keys(m.data).sort().forEach(k => take(m.data[k]));
      return;
    }
    take(m.data);
  });
  // 잠깐 끊긴 건 EventSource가 알아서 다시 붙는다. 여기로 오는 건 되살릴 수 없는 경우뿐이다
  es.onerror = () => { if(es.readyState === EventSource.CLOSED && onBroken) onBroken(); };

  /* 쪽지 하나가 못 가면 양쪽이 서로를 기다리며 영원히 멈춘다.
     조용히 삼키지 않는다 — 두 번 더 보내보고, 그래도 안 되면 알린다 */
  const send = (body, left) =>
    fetch(roomUrl(code), { method:"POST", body:body })
      .then(r => { if(!r.ok) throw new Error("http " + r.status); })
      .catch(err => {
        if(left <= 0) throw err;
        return new Promise(go => setTimeout(go, 600)).then(() => send(body, left - 1));
      });

  return {
    put: note => {
      note.from = ME;
      send(JSON.stringify(note), 2).catch(() => { if(onBroken) onBroken(); });
    },
    close: () => es.close()
  };
}

/* 경기가 끝나면 쪽지는 버린다. 남겨둘 이유가 없고, 다음 경기에 섞이면 안 된다 */
function wipeRoom(code){
  return fetch(roomUrl(code), { method:"DELETE" }).catch(() => {});
}

/* 주소가 틀렸거나 인터넷이 안 되면 아이는 영문도 모른 채 기다리게 된다.
   방을 열기 전에 사물함에 한 번 손을 대본다 */
async function lockerReachable(code){
  if(!CFG.LOCKER) return false;
  try{
    const r = await fetch(roomUrl(code) + "?shallow=true", { cache:"no-store" });
    return r.ok;
  }catch(e){ return false; }
}

function lockerDown(){
  endSession();
  netClose();
  handoff("연결이 안 돼요",
          "인터넷이 켜져 있는지 봐줄래?<br>그래도 안 되면 어른에게 말해줘.",
          () => show("home"), "알겠어요");
}

const NET = { locker:null, code:"", host:false, commit:null, nonce:null, dn:null, hold:[], sent:{},
              pingId:null, waitId:null,
              broken:false };   // 끊김을 한 번만 알리는 빗장. 방을 열 때 내린다

function netPut(note){
  note.k = G.kick;              // 몇 번째 킥의 쪽지인지 적어 보낸다
  if(NET.locker) NET.locker.put(note);
}

/* 한 턴에 같은 쪽지는 한 번만 보낸다.
   제한시간과 손가락이 겹치면 두 번 보내지고, 그러면 양쪽이 다른 값으로 판정한다 */
function netOnce(key){
  if(NET.sent[key]) return false;
  NET.sent[key] = true;
  return true;
}
function netClose(){
  NET.hold = [];
  NET.broken = true;      // 닫기로 한 이상, 뒤늦게 돌아온 실패로 또 말을 걸지 않는다
  if(NET.pingId){ clearInterval(NET.pingId); NET.pingId = null; }
  if(NET.waitId){ clearTimeout(NET.waitId); NET.waitId = null; }
  if(NET.locker){ NET.locker.close(); NET.locker = null; }
}
/* 나갈 때는 상대를 화면 앞에 세워두지 않는다.
   endMatch()는 이걸 부르지 않는다 — 양쪽 연출 시차 때문에, 아직 안 끝난 상대가
   정상 종료를 "나갔다"로 잘못 읽는다. 결과 화면에서 홈으로 나갈 때는 보내지만
   그때는 양쪽 다 경기가 끝나 있어서, 받아도 사물함만 닫고 끝난다. */
function netLeave(){
  roomTicket++;                 // 방을 여는 중이었다면 그 일은 없던 걸로 한다
  if(G.mode === "net") netPut({ t:"bye" });
  // 방을 연 쪽이 치운다. 게스트가 치우면 아직 보는 중인 주인 화면이 끊긴다
  if(NET.host && NET.code) wipeRoom(NET.code);
  NET.host = false;
  netClose();
}

/* 선택을 잠근다. 상대는 잠긴 것만 받으므로 내용을 볼 수 없고,
   나중에 열쇠를 받아 맞는지만 확인할 수 있다 (불변 원칙 7) */
async function lock(text){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    // crypto.subtle은 https와 localhost에서만 쓸 수 있다. LAN http로 열면 여기로 온다 —
    // 아이가 뚫을 수준은 아니지만 제대로 된 잠금은 아니다
    let h = 2166136261;
    for(let i=0;i<text.length;i++){ h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    return "weak" + (h >>> 0).toString(16);
  }
}

const LOCKER_NOTE = "같은 와이파이가 아니어도 돼요.<br>둘 다 인터넷만 되면 연결돼요.";

/* 방을 여는 데는 사물함을 두 번 다녀와야 한다. 그 사이에 아이가 "← 뒤로"를 누르면
   늦게 돌아온 쪽이 홈 화면을 도로 뺏고 에너지까지 깎아갔다 — 아무 일도 안 했는데
   하루치가 사라졌다. 나갈 때 이 번호를 올려서, 돌아온 쪽이 자기 차례가 지났음을 알게 한다. */
let roomTicket = 0;

/* ---------- 방 만들기 (주인) ---------- */
async function createRoom(){
  if(energyLeft() <= 0){ openEnergy("오늘 경기를 다 했어요."); return; }
  const my = ++roomTicket;
  const code = String(Math.floor(1000 + Math.random() * 9000));

  // 에너지는 사물함이 열리는 걸 확인한 뒤에 쓴다 —
  // 인터넷이 안 되는데 하루치가 깎이면 아이에게 설명할 길이 없다
  $("room-title").textContent = "방을 여는 중";
  $("room-code").textContent = "----";
  $("room-msg").innerHTML = "잠깐만…";
  $("room-limit").innerHTML = "";
  show("room");
  const up = await lockerReachable(code);
  if(my !== roomTicket) return;        // 기다리는 사이에 아이가 나갔다
  if(!up){ lockerDown(); return; }
  await wipeRoom(code);                // 지난 경기 쪽지가 섞이면 안 된다
  if(my !== roomTicket) return;        // 여기서도 한 번 더 — 에너지는 이 줄 다음에 깎인다

  store.guestColor = distinctFrom(
    pickedColor($("guest-colors"), store.guestColor), store.owner.color);
  saveStore();
  spendEnergy();                       // 방을 여는 순간 쓴다 (기획서 8장)
  paintHomeEnergy();
  NET.code = code;
  NET.host = true;
  NET.broken = false;
  NET.locker = openLocker(NET.code, note => {
    if(note.t === "join"){
      // join은 한 번만 받는다. 끊겼다 붙으면 방에 쌓인 쪽지가 통째로 다시 오고,
      // 게스트가 1.5초마다 쏘던 join이 시작 직후에 도착하기도 한다 —
      // 경기 중에 받아주면 resetMatch가 돌아 점수가 0:0으로 날아간다
      if(G.running) return;
      netPut({ t:"start", oc:store.owner.color, on:store.owner.num, gc:store.guestColor });
      startNetMatch(0, store.owner.color, store.owner.num, store.guestColor);
      return;
    }
    netPlay(note);
  }, netBroken);
  $("room-title").textContent = "방을 열었어요";
  $("room-code").textContent = NET.code;
  $("room-msg").innerHTML = "게스트 폰에서 <b>방 코드로 참여</b>를 누르고<br>이 숫자를 넣으면 바로 시작해요.";
  $("room-limit").innerHTML = LOCKER_NOTE;
  show("room");
}

/* ---------- 방 참여 (게스트) ---------- */
async function joinRoom(code){
  const my = ++roomTicket;
  NET.code = code;
  NET.host = false;
  $("room-title").textContent = "들어가는 중";
  $("room-code").textContent = code;
  $("room-msg").innerHTML = "잠깐만…";
  $("room-limit").innerHTML = "";
  show("room");
  const up = await lockerReachable(code);
  if(my !== roomTicket) return;        // 기다리는 사이에 아이가 나갔다
  if(!up){ lockerDown(); return; }
  NET.broken = false;
  NET.locker = openLocker(code, note => {
    if(note.t === "start"){
      if(G.running) return;      // 다시 붙으면 start도 또 온다. 경기 중이면 못 본 걸로 한다
      netClose0();
      startNetMatch(1, note.oc, note.on, note.gc);
      return;
    }
    netPlay(note);
  }, netBroken);
  // 주인이 아직 방을 안 열었을 수도 있다. 열릴 때까지 계속 문을 두드린다
  netPut({ t:"join" });
  NET.pingId = setInterval(() => netPut({ t:"join" }), 1500);
  NET.waitId = setTimeout(() => {
    $("room-msg").innerHTML = "아직 아무도 없어요 😅<br>코드를 다시 확인해줄래?";
  }, 12000);
  $("room-msg").innerHTML = "주인이 방을 열면 바로 시작해요.";
  $("room-limit").innerHTML = LOCKER_NOTE;
}
/* 경기가 시작되면 문 두드리기만 멈춘다 — 사물함은 계속 써야 한다 */
function netClose0(){
  if(NET.pingId){ clearInterval(NET.pingId); NET.pingId = null; }
  if(NET.waitId){ clearTimeout(NET.waitId); NET.waitId = null; }
}

function startNetMatch(side, oc, on, gc){
  G.mode = "net";
  G.side = side;
  NET.hold = [];
  G.players = [
    { name: side === 0 ? OWNER : OPP, color: oc, num: on || "7" },
    { name: side === 1 ? OWNER : OPP, color: gc, num: "1" }
  ];
  resetMatch();
}

/* ---------- 한 킥의 주고받기 ----------
   공격수  → 잠근 값만 올린다 (내용은 못 본다)
   골키퍼  → 잠긴 걸 보고 자기 방향을 올린다
   공격수  → 열쇠를 올린다
   양쪽    → 열어서 확인하고 같은 장면을 재생한다
   ---------------------------------------------------------- */
function netPlay(m){
  if(!G.running){
    if(m.t === "bye") netClose();
    return;
  }
  if(m.t === "bye"){ netFail("상대가 나갔어요."); return; }

  /* 두 폰은 같은 속도로 가지 않는다 — 연출 시간이 기기마다 다르고,
     화면이 가려진 폰은 타이머가 느려진다. 그래서 쪽지에 킥 번호를 적어 보낸다.
       지난 킥의 쪽지  → 버린다 (이미 끝난 일이다. 받아주면 판정이 어긋난다)
       다음 킥의 쪽지  → 들고 있다가 그 턴이 열릴 때 꺼낸다 (버리면 양쪽이 멈춘다)
     둘 다 탭 두 개 시험에서 실제로 겪었다. */
  if(m.k < G.kick) return;
  if(m.k > G.kick || !G.turnOpen){ NET.hold.push(m); return; }
  netHandle(m);
}

/* 턴이 열릴 때, 미리 와 있던 쪽지를 다시 넣어본다 (아직 먼 턴 것이면 또 들고 있는다) */
function netDrain(){
  const q = NET.hold;
  NET.hold = [];
  q.forEach(m => { if(G.running) netPlay(m); });
}

function netHandle(m){
  if(m.t === "commit"){          // 나는 골키퍼다
    if(G.turn === G.side) return;   // 내가 공격인 턴에 올 쪽지가 아니다
    NET.commit = m.h;
    defendPhase();
  }else if(m.t === "dive"){      // 나는 공격수다 — 이제 열쇠를 준다
    if(!G.shot || !netOnce("reveal")) return;
    G.dive = m.cell;
    G.diveTo = m.to || 0;       // 상대가 시간이 끝나 제자리에 섰는지. 연출 문구만 달라진다
    NET.dn = m.dn;              // 골키퍼가 보낸 숫자. 뚫는지 가를 때 내 열쇠와 섞는다
    // to는 잠긴 값이 아니다 — 바꿔치기해도 바뀌는 건 문구뿐이고, 결과는 commit이 쥐고 있다
    netPut({ t:"reveal", c:G.shot.cell, p:G.shot.power, n:NET.nonce, to:G.shot.to || 0 });
    resolve();
  }else if(m.t === "reveal"){    // 나는 골키퍼다 — 열어서 맞는지 본다
    netReveal(m);
  }
}

async function netCommit(){
  if(!netOnce("commit")) return;
  // 두 폰이 같은 숫자로 판정해야 한다. 보낼 때만 반올림하면 내 폰은 81.6으로,
  // 상대 폰은 82로 보고 한쪽은 SAVE, 한쪽은 GOAL이 나온다 — 여기서 한 번 굳힌다
  G.shot.power = Math.round(G.shot.power);
  NET.nonce = String(Math.random()).slice(2) + String(Math.random()).slice(2);
  NET.commit = await lock(G.shot.cell + "|" + G.shot.power + "|" + NET.nonce);
  netPut({ t:"commit", h:NET.commit });
  netWait("상대가 막을 곳을 고르는 중…");
}

async function netReveal(m){
  const good = (await lock(m.c + "|" + m.p + "|" + m.n)) === NET.commit;
  if(!good){ netFail("상대 폰이 보낸 값이 잠가둔 것과 달라요."); return; }
  NET.nonce = m.n;              // 공격수의 열쇠. 내 숫자와 섞어 뚫는지 가른다
  G.shot = { cell:m.c, power:m.p, to:m.to || 0 };
  G.history[G.turn].push(m.c);
  resolve();
}

/* 상대를 기다리는 동안. 누를 게 없으므로 버튼을 내린다 (불변 원칙 20) */
function netWait(msg){
  prompt_(msg);
  action(false, "🤫 기다리는 중…");
}

function netFail(why){
  if(!G.running) return;
  endSession();
  netClose();
  handoff("경기를 멈췄어요", why + "<br>방을 다시 열어서 해보자.", () => show("home"), "알겠어요");
}

/* 사물함이 끊겼다 — 쪽지를 세 번 보내도 못 갔거나, 다시 붙지도 못했다.
   멈춘 화면 앞에 아이를 세워두지 않는다. 기다리던 중이냐 경기 중이냐로 갈린다. */
function netBroken(){
  if(NET.broken) return;    // 한 번만. 아래 두 길이 모두 netClose()로 빗장을 내린다
  if(G.running) netFail("쪽지가 오가지 않아요.");
  else lockerDown();
}

/* ============================================================
   설정 화면
   ============================================================ */
function colorOf(id){ return (COLORS.find(c => c.id === id) || COLORS[0]).v; }

// 유니폼 색 위에 올릴 등번호 색 — 흰 유니폼에 흰 글씨가 되면 안 된다
function textOn(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114) / 1000 > 150 ? "#16301f" : "#fff";
}

/* 골키퍼 유니폼 색은 "지금 누가 막고 있는지"를 알려주는 유일한 표시다.
   양쪽이 같은 색이면 그 단서가 사라지므로 상대는 반드시 다른 색으로 보낸다. */
function distinctFrom(want, avoid){
  if(want !== avoid) return want;
  const alt = COLORS.find(c => c.id !== avoid);
  return alt ? alt.id : want;
}

/* 색 고르기 — 내 선수 화면과 게스트 화면이 같이 쓴다. exclude는 고를 수 없게 가린다 */
function buildSwatches(el, selected, exclude){
  el.innerHTML = "";
  COLORS.forEach(c => {
    if(c.id === exclude) return;
    const b = document.createElement("button");
    b.className = "sw" + (c.id === selected ? " sel" : "");
    b.style.background = c.v;
    b.dataset.c = c.id;
    b.setAttribute("aria-label", c.name);
    b.onclick = () => {
      el.querySelectorAll(".sw").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      SFX.tap();
    };
    el.appendChild(b);
  });
}
function pickedColor(el, fallback){
  const sel = el.querySelector(".sw.sel");
  return sel ? sel.dataset.c : fallback;
}

/* ---------- 내 선수 ---------- */
function buildMe(){
  buildSwatches($("me-colors"), store.owner.color);
  $("me-num").value = store.owner.num || "";
  $("me-pinstate").innerHTML = store.pin
    ? "게스트와 대결하려면 비밀번호를 넣어야 해요."
    : "아직 비밀번호가 없어요.<br><b>정해두면 너만 게스트 대결을 열 수 있어요.</b>";
  $("me-pinset").textContent = store.pin ? "비밀번호 바꾸기" : "비밀번호 정하기";
  show("me");
}
/* 폼에 고른 것을 store에 담는다. 비밀번호 화면에 갔다 오면 buildMe가 store에서
   다시 읽으므로, 넘어가기 전에 반드시 여기를 거쳐야 고른 색이 날아가지 않는다 */
function stashMe(){
  store.owner.color = pickedColor($("me-colors"), store.owner.color);
  // type=number는 "1.5"나 "-3"도 받아준다. 그냥 두 글자를 잘라 쓰면 등번호가
  // "1." 이 되어 골키퍼 가슴에 그대로 찍힌다. 숫자만 남기고 1~99로 묶는다
  const n = String($("me-num").value || "").replace(/\D/g, "").slice(0, 2);
  store.owner.num = (n && +n > 0) ? String(+n) : "7";
  saveStore();
}
function saveMe(){
  stashMe();
  SFX.tap();
  paintHomeEnergy();
  show("home");
}

/* ---------- 게스트 대결 ---------- */
function buildGuest(){
  // 주인 색은 아예 고를 수 없게 가린다
  buildSwatches($("guest-colors"),
                distinctFrom(store.guestColor, store.owner.color),
                store.owner.color);
  const left = energyLeft();
  const g = $("guest-energy");
  g.innerHTML = left
    ? pips(left) + "<br>오늘 <b>" + left + "판</b> 남았어요."
    : pips(0) + "<br>오늘 경기를 다 했어요.";
  g.classList.toggle("empty", left <= 0);
  show("guest");
}
function startGuestMatch(){
  if(energyLeft() <= 0){ openEnergy("오늘 경기를 다 했어요."); return; }
  store.guestColor = distinctFrom(
    pickedColor($("guest-colors"), store.guestColor), store.owner.color);
  saveStore();
  G.mode = "duo";
  G.players = [
    { name:OWNER, color:store.owner.color, num:store.owner.num },
    { name:GUEST, color:store.guestColor, num:"1" }
  ];
  spendEnergy();
  resetMatch();
}

/* ---------- 혼자 연습 ---------- */
function startSoloMatch(){
  if(energyLeft() <= 0){ openEnergy("오늘 경기를 다 했어요."); return; }
  G.mode = "solo";
  G.players = [
    { name:OWNER, color:store.owner.color, num:store.owner.num },
    { name:BOT, color:distinctFrom("purple", store.owner.color), num:"1", ai:true }
  ];
  spendEnergy();
  resetMatch();
}

/* 결과 화면의 "한 판 더" — 아이가 벽에 부딪히는 자리는 대부분 여기다 */
function playAgain(){
  if(energyLeft() <= 0){ openEnergy("오늘 경기를 다 했어요."); return; }
  spendEnergy();
  resetMatch();
}

function resetMatch(){
  G.score = [0,0];
  G.kick = 0;
  G.round = 1;
  G.turn = 0;
  G.sudden = false;
  G.history = [[],[]];
  G.running = true;
  keepAwake(true);

  $("m-n0").textContent = G.players[0].name;
  $("m-n1").textContent = G.players[1].name;
  paintScore();
  show("match");
  SFX.whistle();
  beginTurn();
}

function paintScore(){
  $("m-s0").textContent = G.score[0];
  $("m-s1").textContent = G.score[1];
  $("m-round").textContent = G.sudden
    ? "서든데스 " + G.round + "라운드"
    : G.round + " / " + CFG.ROUNDS + " 라운드";
}

/* ============================================================
   한 턴 진행
   ============================================================ */
function beginTurn(){
  G.shot = null;
  G.dive = null;
  G.diveTo = 0;
  G.defending = false;
  G.resolved = false;
  resetPitch();

  const atk = G.players[G.turn];
  const kp  = G.players[1 - G.turn];

  if(G.mode === "net"){
    NET.commit = null; NET.nonce = null; NET.dn = null; NET.sent = {};
    G.kick++;
    G.turnOpen = true;
    if(G.turn === G.side) attackPhase();
    else netWait("상대가 찰 곳을 고르는 중…");
    netDrain();          // 턴이 열리기 전에 와 있던 쪽지를 지금 꺼낸다
    return;
  }

  if(G.mode === "duo"){
    // 공격수가 폰을 받아야 한다
    const mine = atk.name === OWNER;
    handoff(mine ? "네 차례!" : "게스트 차례!",
            "공을 찰 사람이에요.<br>" + (mine ? "게스트는" : "너는") + " 화면을 보면 안 돼요 👀",
            () => attackPhase());
  }else{
    attackPhase();
  }
}

function resetPitch(){
  const cells = $("cells");
  cells.innerHTML = "";
  cells.classList.remove("live");
  for(let i=0;i<6;i++){
    const d = document.createElement("div");
    d.className = "cell";
    d.dataset.i = i;
    cells.appendChild(d);
  }
  const ball = $("ball");
  ball.classList.remove("fly");
  ball.style.left = "50%";
  ball.style.top = "88%";
  ball.style.width = "12%";

  const k = $("keeper");
  k.style.left = "50%";
  k.style.top = "46%";
  const kp = G.players[1 - G.turn];
  const kc = colorOf(kp.color);
  k.querySelector(".body").style.background = kc;
  const num = $("k-num");
  num.textContent = kp.num || "";
  num.style.color = textOn(kc);

  $("verdict").className = "verdict";
  $("verdict").innerHTML = "";
  $("m-hint").classList.remove("on");
  gaugeOff();
}

/* ---------- 공격 ---------- */
function attackPhase(){
  const atk = G.players[G.turn];

  if(atk.ai){
    prompt_(josa(atk.name, "이", "가") + " 준비 중…");
    action(false, "잠깐 기다려…");
    later(() => {
      G.shot = aiShoot();
      G.history[G.turn].push(G.shot.cell);
      defendPhase();
    }, 900);
    return;
  }

  // 같은 곳만 차면 읽힌다 — 공격수에게 경고
  const h = G.history[G.turn];
  if(h.length >= 2 && h[h.length-1] === h[h.length-2]){
    $("m-hint").textContent = "⚠️ 같은 곳만 차고 있어! 읽히겠는데?";
    $("m-hint").classList.add("on");
  }

  prompt_("어디로 찰까? 🎯");
  action(false, "☝️ 골대에서 찰 곳을 눌러줘");
  $("cells").classList.add("live");
  bindCells(cell => {
    G.shot = { cell: cell, power: 0 };
    markCell(cell);
    $("cells").classList.remove("live");
    $("m-hint").classList.remove("on");
    powerPhase();
  });
  startTimer(() => {
    // 시간 초과 = 실축. 파워를 고르던 중일 수도 있으므로 버튼과 게이지를 확실히 닫는다.
    // to를 남긴다 — 찬 적이 없는데 "너무 세게 찼어"라고 하면 아이는 자기가 뭘
    // 잘못했는지 영영 모른다
    G.shot = { cell: 4, power: 100, to: 1 };
    G.history[G.turn].push(4);
    $("cells").classList.remove("live");
    unbindCells();
    gaugeOff();
    action(false, "…");
    if(G.mode === "net"){ netCommit(); return; }
    defendPhase();
  });
}

function powerPhase(){
  prompt_("얼마나 세게? 💪");
  action(true, "차기!");
  gaugeOn();
  $("m-action").onclick = () => {
    const p = stopGauge();
    G.shot.power = p;
    G.history[G.turn].push(G.shot.cell);
    stopTimer();
    SFX.kick();
    buzz(20);
    action(false, "…");
    if(G.mode === "net"){ netCommit(); return; }   // 잠근 값만 올리고 기다린다
    defendPhase();
  };
}

/* ---------- 수비 ---------- */
function defendPhase(){
  if(G.defending) return;   // 이 턴의 수비는 이미 시작됐다
  G.defending = true;
  gaugeOff();
  const kp = G.players[1 - G.turn];

  if(kp.ai){
    prompt_(josa(kp.name, "이", "가") + " 막으러 갑니다!");
    later(() => { G.dive = aiDive(); resolve(); }, 700);
    return;
  }

  const go = () => {
    prompt_("어디로 뛸까? 🧤");
    action(false, "☝️ 골대에서 뛸 곳을 눌러줘");
    resetPitch();                       // 공격수 선택 흔적 제거
    $("cells").classList.add("live");
    bindCells(cell => {
      G.dive = cell;
      $("cells").classList.remove("live");
      stopTimer();
      if(G.mode === "net"){
        if(netOnce("dive")) netPut({ t:"dive", cell:cell, dn:NET.dn = String(Math.random()).slice(2) });
        netWait("상대가 공을 보여주는 중…");
        return;
      }
      resolve();
    });
    startTimer(() => {
      // 시간 초과 = 제자리. 골키퍼가 서 있는 칸은 가운데 아래(4)이므로 그쪽은 막힌다 —
      // -1로 두면 골키퍼 몸에 공이 꽂히는데 골로 판정됐다
      G.dive = 4;
      G.diveTo = 1;                   // 안 뛴 게 아니라 시간이 끝난 것이다. 연출 문구가 달라진다
      $("cells").classList.remove("live");
      unbindCells();                  // 시간이 지난 뒤 눌러서 한 번 더 보내지면 안 된다
      if(G.mode === "net"){
        if(netOnce("dive")) netPut({ t:"dive", cell:4, to:1, dn:NET.dn = String(Math.random()).slice(2) });
        netWait("상대가 공을 보여주는 중…");
        return;
      }
      resolve();
    });
  };

  if(G.mode === "duo"){
    const toOwner = kp.name === OWNER;
    handoff(toOwner ? "너에게 돌려주세요" : "게스트에게 넘겨주세요",
            "골키퍼예요! 어디로 뛸지 고르세요.<br>" +
            (toOwner ? "게스트가" : "네가") + " 어디 찼는지는 비밀 🤫", go);
  }else{
    go();
  }
}

/* ---------- 결과 판정 ---------- */
/* roll은 0~1. 읽혔을 때 강슛이 뚫리는지를 가른다 — 아래 shotRoll() 참고.
   예전에는 강슛 구간에 들어가기만 하면 무조건 골이었다. 그래서 게이지 타이밍을
   익힌 아이는 100% 넣었고, 둘 다 익히면 매 경기 동점에 서든데스가 안 끝났다. */
function judge(shot, dive, roll, reach){
  if(shot.power > CFG.POWER_OVER)              return "MISS";
  if(dive === shot.cell){
    if(shot.power < CFG.POWER_STRONG) return "SAVE";
    // 실축 선에 가깝게 찰수록 손을 뚫고 들어갈 확률이 오른다 (20% → 80%)
    const t = (shot.power - CFG.POWER_STRONG) / (CFG.POWER_OVER - CFG.POWER_STRONG);
    return roll < (0.20 + 0.60 * t) ? "GOAL_HARD" : "SAVE";
  }
  if(ADJACENT[shot.cell].indexOf(dive) !== -1){
    if(shot.power < CFG.POWER_WEAK) return "SAVE_TOE";       // 약슛은 발끝에 확실히 걸린다
    // 보통 세기는 뻗은 손에 닿을 때가 있다. 이 한 줄이 없으면 "아무 데나 중간 세기"가
    // 위험 0에 득점률 83%라, 게이지를 쓸 이유도 골키퍼가 할 일도 사라진다
    if(shot.power < CFG.POWER_STRONG) return reach < CFG.REACH ? "SAVE_TOE" : "GOAL";
    // 강슛은 손끝을 뚫고 지나간다 — 세게 차는 값어치가 여기서 나온다
  }
  return "GOAL";
}

/* 읽혔을 때 강슛이 뚫리는지 가르는 값.
   각자 폰으로 할 때 두 폰이 서로 다른 답을 내면 경기가 통째로 어긋난다.
   그래서 주사위를 굴리지 않고, 공격수의 열쇠(nonce)와 골키퍼의 숫자(dn)를 섞는다.
   둘 다 상대 것을 모르는 채로 정하므로 어느 쪽도 결과를 고를 수 없다. */
/* salt로 서로 다른 값을 몇 개든 뽑는다 — 강슛이 뚫리는지(hard)와
   손끝이 닿는지(toe)는 따로 굴려야 한다. 같은 값을 두 번 쓰면 둘이 묶여버린다 */
function shotRoll(salt){
  if(G.mode !== "net") return Math.random();
  const seed = salt + "|" + String(NET.nonce) + "|" + String(NET.dn);
  let h = 2166136261;
  for(let i=0;i<seed.length;i++){ h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}

function resolve(){
  if(G.resolved) return;    // 한 킥은 한 번만 판정한다
  G.resolved = true;
  G.turnOpen = false;       // 이번 턴은 닫혔다. 다음 턴 쪽지는 들고 있는다
  stopTimer();
  unbindCells();
  prompt_("");
  action(false, "…");
  const r = judge(G.shot, G.dive, shotRoll("hard"), shotRoll("toe"));
  const scored = (r === "GOAL" || r === "GOAL_HARD");

  // 공과 골키퍼 애니메이션
  const ball = $("ball");
  const k = $("keeper");
  ball.classList.add("fly");

  // 공이 어디서 멈추는지가 결과를 말해준다 — 칸 한가운데로 보내면 골키퍼와 겹쳐서 안 보인다
  let bx, by, bw = 9;
  if(r === "MISS"){
    bx = 50; by = -22; bw = 7;
  }else if(r === "SAVE" || r === "SAVE_TOE"){
    const d = cellPos(G.dive);
    bx = d.x;
    by = d.y + (r === "SAVE" ? 13 : 16);   // 품에 안기거나 발 끝에 걸린다
    bw = 8;
  }else{
    const c = cellPos(G.shot.cell);
    bx = c.x;
    by = c.y - (r === "GOAL_HARD" ? 9 : 0); // 손 위로 튕겨 들어간다
    bw = r === "GOAL_HARD" ? 8 : 9;
  }
  ball.style.left = bx + "%";
  ball.style.top = by + "%";
  ball.style.width = bw + "%";

  const d2 = cellPos(G.dive);
  k.style.left = d2.x + "%";
  k.style.top = (d2.y + 6) + "%";

  later(() => {
    const v = $("verdict");
    /* 시간이 끝나 저절로 정해진 턴에는 연출 문구가 거짓말을 하면 안 된다.
       차지도 않았는데 "너무 세게 찼어"라고 하면 아이는 자기가 뭘 잘못했는지
       영영 모른다. 골키퍼가 못 뛴 것도 마찬가지다. */
    if(r === "GOAL"){
      const cheer = CELEBRATIONS[Math.floor(Math.random() * CELEBRATIONS.length)];
      v.innerHTML = 'GOAL!<small>' + (G.diveTo ? '골키퍼가 시간 안에 못 뛰었어 ⏰' : cheer) + '</small>';
      SFX.goal(); buzz([30,40,130]); confetti();
    }else if(r === "GOAL_HARD"){
      // 골키퍼가 제자리에 섰어도 공이 그 칸으로 왔다는 뜻이라 "손에 맞고"가 맞다
      v.innerHTML = 'GOAL!<small>손에 맞고 들어갔어!</small>';
      SFX.goal(); buzz([30,40,130]); confetti();
    }else if(r === "SAVE"){
      // 세게 찼는데 막힌 것과 그냥 읽힌 것은 다른 일이다. 아이가 구분할 수 있어야 한다
      v.innerHTML = G.diveTo
        ? 'SAVE!<small>골키퍼가 안 움직였는데 정면이었어 😅</small>'
        : (G.shot.power >= CFG.POWER_STRONG
            ? 'SAVE!<small>손끝에 걸렸어! 😤</small>'
            : 'SAVE!<small>정확히 읽었다 🧤</small>');
      SFX.save(); buzz(70); $("goalwrap").classList.add("shake");
    }else if(r === "SAVE_TOE"){
      // 약하게 차서 발에 걸린 것과, 제대로 찼는데 뻗은 손에 닿은 것은 다른 일이다
      v.innerHTML = G.diveTo
        ? 'SAVE!<small>가만히 선 발에 걸렸어! 😅</small>'
        : (G.shot.power < CFG.POWER_WEAK
            ? 'SAVE!<small>살살 차서 발 끝에 걸렸어!</small>'
            : 'SAVE!<small>뻗은 손에 맞고 나갔어! 🧤</small>');
      SFX.save(); buzz(70); $("goalwrap").classList.add("shake");
    }else{
      v.innerHTML = G.shot.to
        ? '시간 끝!<small>고르는 사이에 휘슬이 울렸어 ⏰</small>'
        : '빗나감!<small>너무 세게 찼어 😵</small>';
      SFX.miss(); buzz([20,40,20]);
    }
    v.classList.add("show");
    later(() => $("goalwrap").classList.remove("shake"), 360);

    if(scored) G.score[G.turn]++;
    paintScore();

    later(nextTurn, 1700);
  }, 450);
}

function cellPos(i){
  const col = i % 3, row = Math.floor(i / 3);
  // 골대는 wrap 기준 top 4% ~ 56% 구간을 차지한다
  const gx = 16.7 + col * 33.3;
  const gy = 4 + (25 + row * 50) * 0.52;
  return { x: gx, y: gy };
}

/* ---------- 다음 턴 / 종료 ---------- */
function nextTurn(){
  if(G.turn === 0){
    G.turn = 1;
    beginTurn();
    return;
  }
  // 한 라운드(양쪽 한 번씩) 종료
  G.turn = 0;
  const [a,b] = G.score;

  if(G.sudden){
    if(a !== b){ endMatch(); return; }
    // 끝없이 끌지 않는다. 여기까지 동점이면 비긴 걸로 둔다
    if(G.round >= CFG.SUDDEN_MAX){ endMatch(); return; }
    G.round++;
    paintScore();
    beginTurn();
    return;
  }

  // 남은 킥을 다 넣어도 못 뒤집으면 거기서 끝낸다.
  // 4:0인데 네 번을 더 차는 건 지는 쪽에게 가장 지루한 구간이다.
  // 라운드 경계에서만 보므로 양쪽 킥 수는 언제나 같다 (원칙 9).
  if(Math.abs(a - b) > CFG.ROUNDS - G.round){ endMatch(); return; }

  if(G.round >= CFG.ROUNDS){
    if(a === b){
      G.sudden = true;
      G.round = 1;
      paintScore();
      handoff("서든데스! ⚡", "동점이에요.<br>한 라운드라도 앞서면 바로 끝납니다.", beginTurn);
    }else{
      endMatch();
    }
    return;
  }

  G.round++;
  paintScore();
  beginTurn();
}

function endMatch(){
  endSession();
  SFX.whistle();

  const [a,b] = G.score;
  const win = a > b ? 0 : (b > a ? 1 : -1);
  const me = (G.mode === "net") ? G.side : 0;   // 각자 폰이면 이 폰이 맡은 쪽이 "나"다

  $("res-score").textContent = a + " : " + b;
  if(win === -1){
    $("res-icon").textContent = "🤝";
    $("res-winner").textContent = "비겼어!";
  }else if(win === me){
    // 주인에게 말을 거는 화면이다 — "나 승리!"는 어색하다
    $("res-icon").textContent = "🏆";
    $("res-winner").textContent = "네가 이겼어!";
  }else{
    $("res-icon").textContent = "😢";
    $("res-winner").textContent = josa(G.players[win].name, "이", "가") + " 이겼어";
  }

  recordResult(win);

  // 각자 폰은 둘이 있어야 다시 한다 — 혼자 "한 판 더"를 누를 수 없다
  if(G.mode === "net"){
    $("res-energy").innerHTML = G.side === 0
      ? "또 하려면 방을 다시 열어줘"
      : "주인이 방을 다시 열면 또 할 수 있어";
    $("res-again").style.display = "none";
    show("result");
    return;
  }

  // 한 판 더 누르고 나서야 막힌 걸 알면 늦다
  const left = energyLeft();
  $("res-energy").innerHTML = left
    ? '<span class="pipline">' + pips(left) + '</span>' + left + '판 더 할 수 있어'
    : '<span class="pipline">' + pips(0) + '</span>오늘 경기는 여기까지!<br>' + refillWhen() + '에 가득 차요';
  $("res-again").style.display = left ? "" : "none";

  show("result");
}

/* 전적은 언제나 주인(players[0]) 기준이다 */
function recordResult(win){
  // 게스트 폰에는 비밀번호도 에너지도 기록도 두지 않는다 (기획서 8장)
  if(G.mode === "net" && G.side !== 0) return;
  const rec = G.mode === "solo" ? store.solo : store.guest;
  if(win === 0) rec.w++;
  else if(win === 1) rec.l++;
  else rec.d++;
  if(G.mode === "solo") rec.best = Math.max(rec.best, G.score[0]);
  saveStore();
}

/* ============================================================
   로봇 상대
   ============================================================ */
function aiShoot(){
  const cell = Math.floor(Math.random() * 6);
  const r = Math.random();
  let power;
  // 구간이 바뀌면 여기도 같이 바꾼다. 안 그러면 로봇이 실축만 하거나 강슛을 못 한다
  if(r < .08)      power = CFG.POWER_OVER + 1 + Math.random() * 8;                        // 가끔 실축
  else if(r < .42) power = CFG.POWER_STRONG + Math.random() * (CFG.POWER_OVER - CFG.POWER_STRONG); // 강슛
  // 하한은 반드시 POWER_WEAK보다 낮아야 한다. 38이었을 때는 "발 끝에 걸렸어!"가
  // 혼자 연습에서 단 한 번도 안 나왔다 (20만 판 시뮬레이션 0건).
  // 28~75로 박아뒀더니 구간을 옮긴 날 로봇이 약슛만 27% 차는 바보가 됐다 — CFG에서 끌어온다
  else             power = CFG.POWER_WEAK - 7 + Math.random() * (CFG.POWER_STRONG - CFG.POWER_WEAK + 7);
  return { cell: cell, power: power };
}

function aiDive(){
  // 사람이 같은 칸을 반복하면 읽는다.
  // 지금 막아야 할 슛은 이미 history에 들어와 있으므로 반드시 빼고 본다 —
  // 안 그러면 예측이 아니라 정답을 보고 막는 셈이 된다.
  const h = G.history[G.turn].slice(0, -1);
  if(h.length >= 2 && h[h.length-1] === h[h.length-2] && Math.random() < .45){
    return h[h.length-1];
  }
  return Math.floor(Math.random() * 6);
}

/* ============================================================
   UI 조각
   ============================================================ */
function prompt_(t){ $("m-prompt").textContent = t; }

/* 누를 수 있을 때만 버튼이 나온다. 그 밖에는 점선 안내로 바뀐다 */
function action(enabled, label){
  const b = $("m-action"), h = $("m-hintbar");
  if(enabled){
    h.classList.remove("on");
    b.style.display = "";
    b.textContent = label;
    b.disabled = false;
  }else{
    b.style.display = "none";
    b.disabled = true;
    b.onclick = null;
    h.textContent = label;
    h.classList.add("on");
  }
}

function bindCells(cb){
  $("cells").querySelectorAll(".cell").forEach(c => {
    c.onclick = () => {
      SFX.tap();
      unbindCells();        // 한 번 고르면 끝 — 두 번째 탭으로 선택이 바뀌면 안 된다
      cb(parseInt(c.dataset.i, 10));
    };
  });
}

function unbindCells(){
  $("cells").querySelectorAll(".cell").forEach(c => { c.onclick = null; });
}

function markCell(i){
  const c = $("cells").querySelector('[data-i="' + i + '"]');
  if(c){ c.classList.add("picked"); c.textContent = "⚽"; }
}

/* ---------- 파워 게이지 ---------- */

/* 눈금과 라벨을 CFG에서 그린다. 이걸 CSS에 박아두면 밸런스를 고쳤을 때
   눈금만 옛말이 되어 아이에게 거짓말을 한다 — 실제로 "강슛"이 바 한가운데를
   가리키고 있었고, 진짜 강슛 구간은 오른쪽 끝이었다 */
/* 경기 화면과 규칙 화면이 같은 게이지를 쓴다. 규칙 쪽은 buildRules()가
   그린 뒤에 다시 부르므로, id가 아니라 클래스로 전부 찾는다 */
function paintGauge(){
  const weak = CFG.POWER_WEAK, strong = CFG.POWER_STRONG, over = CFG.POWER_OVER;
  document.querySelectorAll(".gauge").forEach(g => {
    g.querySelector(".zone-weak").style.width   = weak + "%";
    g.querySelector(".zone-strong").style.left  = strong + "%";
    g.querySelector(".zone-strong").style.width = (over - strong) + "%";
    g.querySelector(".zone-over").style.left    = over + "%";
  });
  document.querySelectorAll(".l-strong").forEach(l => {
    l.style.left = ((strong + over) / 2) + "%";
  });
}

let gaugeVal = 0, gaugeDir = 1, gaugeT0 = 0;
function gaugeOn(){
  stopGauge();              // 돌고 있던 루프를 먼저 끊지 않으면 두 루프가 겹쳐 돈다
  $("gaugewrap").classList.add("on");
  gaugeVal = 0; gaugeDir = 1; gaugeT0 = performance.now();
  const step = now => {
    const dt = now - gaugeT0; gaugeT0 = now;
    gaugeVal += gaugeDir * (dt / CFG.GAUGE_MS) * 100;
    if(gaugeVal >= 100){ gaugeVal = 100; gaugeDir = -1; }
    if(gaugeVal <= 0){ gaugeVal = 0; gaugeDir = 1; }
    $("needle").style.left = "calc(" + gaugeVal + "% - 4px)";
    G.gaugeId = requestAnimationFrame(step);
  };
  G.gaugeId = requestAnimationFrame(step);
}
function stopGauge(){
  if(G.gaugeId) cancelAnimationFrame(G.gaugeId);
  G.gaugeId = null;
  return gaugeVal;
}
function gaugeOff(){
  stopGauge();
  $("gaugewrap").classList.remove("on");
}

/* ---------- 제한 시간 ---------- */
function startTimer(onOut, from){
  stopTimer();
  G.timerOut = onOut;        // 잠시 멈췄다가 되살릴 수 있게
  let left = from || CFG.PICK_SEC;
  G.timerLeft = left;
  const el = $("m-timer");
  el.classList.remove("on", "warn");
  G.timerId = setInterval(() => {
    left--;
    G.timerLeft = left;
    if(left <= CFG.TIMER_SHOW){
      el.classList.add("on");
      el.textContent = "⏱ " + left + "초";
      if(left <= 5){ el.classList.add("warn"); SFX.tap(); }
    }
    if(left <= 0){
      stopTimer();
      onOut();
    }
  }, 1000);
}
function stopTimer(){
  if(G.timerId) clearInterval(G.timerId);
  G.timerId = null;
  G.timerOut = null;
  $("m-timer").classList.remove("on", "warn");
}

/* 제한시간을 멈췄다 이어간다. 그만두기 확인과 화면 가려짐이 같은 길을 쓴다 */
function pauseTimer(){
  if(!G.timerId) return;     // 이미 멈춰 있으면 들고 있던 것을 덮어쓰지 않는다
  G.paused = { out:G.timerOut, left:G.timerLeft };
  stopTimer();
}
function resumeTimer(){
  if(!G.running || !G.paused || G.timerId) return;
  startTimer(G.paused.out, G.paused.left);
  G.paused = null;
}

/* ---------- 에너지 안내 화면 ----------
   문을 닫고 끝내지 않는다. 순위 보기와 선수 꾸미기는 에너지 없이도 되게 두어
   마무리가 부드럽게 되도록 한다. */
function openEnergy(reason){
  $("energy-desc").innerHTML = esc(reason) + "<br>" + refillWhen() + "에 다시 가득 차요.";
  $("energy-modal").classList.add("on");
  SFX.tap();
}
function closeEnergy(){
  $("energy-modal").classList.remove("on");
  SFX.tap();
}

/* 홈 화면 에너지 표시 */
function paintHomeEnergy(){
  const left = energyLeft();
  $("home-energy").innerHTML =
    '<div class="erow"><span class="ename">오늘 할 수 있는 경기</span>' +
      '<span class="ebig' + (left ? '' : ' out') + '">' + (left ? left + '판' : '끝') + '</span></div>' +
    '<div class="epip">' + pips(left) + '</div>' +
    // 넉넉할 때는 충전 안내가 군더더기다. 거의 다 썼을 때만 알려준다
    (left > 1 ? '' : '<div class="enote">' + refillWhen() + '에 가득 차요</div>');
  $("home-energy").classList.add("on");

  // 다 쓴 상태를 눌러보기 전에 알 수 있어야 한다
  const out = left <= 0;
  $("go-solo").classList.toggle("spent", out);
  $("go-guest").classList.toggle("spent", out);
}

/* ---------- 비밀번호 ----------
   이 앱은 주인 한 명의 것이다. 게스트 대결은 주인이 열어줘야 시작된다.
   잠금을 세게 걸 생각은 없다 — 형제끼리의 약속을 눈에 보이게 만드는 장치다. */
const PIN = { buf:"", mode:"", first:"", after:null };

function openPin(mode, after){
  PIN.mode = mode;          // "set" | "confirm" | "check" | "room"
  PIN.buf = "";
  PIN.first = "";
  PIN.after = after || null;
  disarmForgot();           // 지난번에 눌러둔 경고가 살아 있으면 안 된다
  $("pin-forgot").style.display = (mode === "check") ? "" : "none";
  paintPin();
  show("pin");
}

function paintPin(){
  const msg = {
    set:     "너만 아는 비밀번호 4자리를 정해줘",
    confirm: "한 번 더 눌러서 확인할게",
    check:   "비밀번호를 넣어줘<br>이 폰 주인만 열 수 있어요",
    room:    "주인이 불러준 방 코드<br>네 자리를 넣어줘"
  }[PIN.mode] || "";
  $("pin-title").textContent =
    PIN.mode === "room"  ? "방 참여" :
    PIN.mode === "check" ? "비밀번호" : "비밀번호 정하기";
  $("pin-msg").innerHTML = msg;
  $("pin-dots").innerHTML = [0,1,2,3]
    .map(i => '<div class="pindot' + (i < PIN.buf.length ? " on" : "") + '"></div>').join("");
}

function buildPinPad(){
  const pad = $("pin-pad");
  pad.innerHTML = "";
  ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k => {
    const b = document.createElement("button");
    b.className = "pinkey" + (k === "" ? " blank" : "");
    b.textContent = k;
    if(k === "") b.disabled = true;
    else b.onclick = () => pinKey(k);
    pad.appendChild(b);
  });
}

function pinKey(k){
  SFX.tap();
  if(k === "⌫"){ PIN.buf = PIN.buf.slice(0, -1); paintPin(); return; }
  if(PIN.buf.length >= 4) return;
  PIN.buf += k;
  paintPin();
  // 네 번째 점이 보이고 나서 넘어간다. 경기용 later()가 아니라 평범한 타이머다
  if(PIN.buf.length === 4) setTimeout(pinDone, 180);
}

function pinDone(){
  // 네 번째 숫자 직후 지우기를 누르면 버퍼가 줄어든다 — 그때는 없던 일로 한다.
  // 안 그러면 3자리 비밀번호가 저장되고, 그건 영영 다시 맞출 수 없다.
  if(PIN.buf.length !== 4) return;
  // 네 번째 점을 보여주는 180ms 사이에 "← 뒤로"를 누를 수도 있다.
  // 그걸 못 보면 홈에 나와 있는 아이를 방 화면으로 도로 끌고 간다
  if(!$("s-pin").classList.contains("on")) return;
  const entered = PIN.buf;
  if(PIN.mode === "set"){
    PIN.first = entered;
    PIN.buf = "";
    PIN.mode = "confirm";
    paintPin();
    return;
  }
  if(PIN.mode === "confirm"){
    if(entered === PIN.first){
      store.pin = entered;
      saveStore();
      SFX.goal();
      const after = PIN.after;
      if(after) after(); else buildMe();
      return;
    }
    PIN.buf = ""; PIN.mode = "set"; PIN.first = "";
    $("pin-msg").innerHTML = "두 번이 달라요 😅<br>다시 정해줄래?";
    $("pin-dots").innerHTML = [0,1,2,3].map(() => '<div class="pindot"></div>').join("");
    SFX.miss();
    return;
  }
  if(PIN.mode === "room"){   // 방 코드는 맞고 틀리고가 없다. 그 방이 없으면 안 열릴 뿐이다
    SFX.tap();
    if(PIN.after) PIN.after(entered);
    return;
  }
  // check
  if(entered === store.pin){
    SFX.tap();
    const after = PIN.after;
    if(after) after();
    return;
  }
  PIN.buf = "";
  $("pin-msg").innerHTML = "비밀번호가 달라요 😅<br>다시 넣어줄래?";
  $("pin-dots").innerHTML = [0,1,2,3].map(() => '<div class="pindot"></div>').join("");
  SFX.miss();
  buzz([40,60,40]);
}

/* 10살이 비밀번호를 잊는 일은 실제로 일어난다.
   영영 잠기면 안 되므로 빠져나갈 길을 두되, 기록을 지우는 대가를 치르게 한다. */
let forgotArmed = null;
function disarmForgot(){
  if(forgotArmed){ clearTimeout(forgotArmed); forgotArmed = null; }
  $("pin-forgot").textContent = "비밀번호를 잊었어요";
}
function pinForgot(){
  const b = $("pin-forgot");
  if(!forgotArmed){
    b.textContent = "기록을 모두 지우고 새로 시작할까? 한 번 더 누르기";
    forgotArmed = setTimeout(disarmForgot, 4000);
    SFX.tap();
    return;
  }
  disarmForgot();
  const keep = { sound:store.sound, vib:store.vib, energy:store.energy };
  store = Object.assign(defaultStore(), keep);
  saveStore();
  paintHomeEnergy();
  show("home");
}

/* ---------- 경기 그만두기 ----------
   아이가 하기 싫어졌을 때 빠져나갈 길이 있어야 한다.
   단, 실수로 한 번 눌러서 경기가 날아가면 안 되므로 반드시 확인을 거친다. */
function openQuit(){
  if(!G.running) return;
  pauseTimer();                 // 고민하는 동안 제한시간이 흐르면 안 된다
  $("quit-desc").innerHTML = ((G.score[0] || G.score[1])
    ? "지금 " + G.score[0] + " : " + G.score[1] + " 인데, 기록에는 남지 않아요."
    : "지금까지 넣은 골은 기록에 남지 않아요.") +
    // 게스트 폰은 에너지를 쓴 적이 없다 — 없는 손해를 알릴 필요 없다
    ((G.mode === "net" && G.side !== 0) ? "" : "<br>쓴 에너지도 돌아오지 않아요.");
  $("quit-modal").classList.add("on");
  SFX.tap();
}

function closeQuit(){
  $("quit-modal").classList.remove("on");
  resumeTimer();             // 멈춘 자리에서 이어간다
  SFX.tap();
}

function quitMatch(){
  $("quit-modal").classList.remove("on");
  netLeave();
  endSession();
  show("home");
}

/* 경기를 떠날 때 반드시 정리할 것들 — 하나라도 빠지면 홈 화면에서 유령이 튀어나온다 */
function endSession(){
  G.running = false;
  G.turnOpen = false;
  clearPending();          // 예약된 연출·다음 턴
  stopTimer();             // 제한시간
  G.paused = null;         // 멈춰둔 제한시간까지 버린다
  gaugeOff();              // 파워 게이지 루프
  unbindCells();           // 골대 칸 핸들러
  $("hoff-ok").onclick = null;
  action(false, "…");
  keepAwake(false);
  $("stage").querySelectorAll(".confetti").forEach(n => n.remove());
}

/* ---------- 폰 넘기기 ---------- */
function handoff(title, desc, cb, label){
  $("hoff-title").textContent = title;
  $("hoff-desc").innerHTML = desc;
  const ok = $("hoff-ok");
  ok.textContent = label || "준비됐어요!";
  ok.onclick = () => {
    ok.onclick = null;     // 한 번만 — 화면이 숨겨져도 핸들러가 남으면 턴이 두 번 돈다
    SFX.tap();
    show("match");
    cb();
  };
  show("handoff");
}

/* ---------- 색종이 ---------- */
function confetti(){
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  const cols = ["#ff5fa2","#ffd93d","#38bdf8","#1f9d55","#fff","#8b5cf6"];
  for(let i=0;i<26;i++){
    const c = document.createElement("div");
    c.className = "conf";
    c.style.left = Math.random() * 100 + "%";
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (.9 + Math.random() * .7) + "s";
    c.style.animationDelay = (Math.random() * .25) + "s";
    wrap.appendChild(c);
  }
  $("stage").appendChild(wrap);
  setTimeout(() => wrap.remove(), 2000);
}

/* ============================================================
   기록 화면
   ============================================================ */
function buildRecords(){
  disarmClear();
  const b = $("rec-body");
  b.innerHTML = "";

  const s = store.solo;
  const soloCard = document.createElement("div");
  soloCard.className = "card";
  soloCard.innerHTML = '<h3>🤖 로봇 상대</h3>' +
    (s.w + s.l + s.d === 0
      ? '<div class="empty">아직 기록이 없어요</div>'
      : '<div class="rec"><span>전적</span><b>' + s.w + '승 ' + s.l + '패 ' + s.d + '무</b></div>' +
        '<div class="rec"><span>한 경기 최다 득점</span><b>' + s.best + '골</b></div>');
  b.appendChild(soloCard);

  const g = store.guest;
  const guestCard = document.createElement("div");
  guestCard.className = "card";
  guestCard.innerHTML = '<h3>⚔️ 게스트 상대</h3>' +
    (g.w + g.l + g.d === 0
      ? '<div class="empty">아직 기록이 없어요</div>'
      : '<div class="rec"><span>전적</span><b>' + g.w + '승 ' + g.l + '패 ' + g.d + '무</b></div>');
  b.appendChild(guestCard);

  show("records");
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}

/* ============================================================
   배선
   ============================================================ */
document.querySelectorAll("[data-go]").forEach(b => {
  b.addEventListener("click", () => {
    SFX.tap();
    const t = b.dataset.go;
    if(t === "home"){ netLeave(); endSession(); paintHomeEnergy(); show("home"); }
    else if(t === "records") buildRecords();
    else if(t === "rules") buildRules();
    else if(t === "me") buildMe();
  });
});

buildPinPad();

$("go-solo").onclick = () => { SFX.tap(); startSoloMatch(); };

/* 게스트 대결은 주인이 열어준다. 비밀번호가 아직 없으면 지금 정한다. */
$("go-guest").onclick = () => {
  SFX.tap();
  // 에너지가 없으면 비밀번호를 치게 하고 나서 막는 건 헛수고다
  if(energyLeft() <= 0){ openEnergy("오늘 경기를 다 했어요."); return; }
  if(!store.pin) openPin("set", buildGuest);
  else openPin("check", buildGuest);
};

$("me-save").onclick   = saveMe;
$("me-pinset").onclick = () => { SFX.tap(); stashMe(); openPin("set", buildMe); };
$("pin-forgot").onclick = pinForgot;
$("guest-start").onclick = () => { SFX.tap(); startGuestMatch(); };
$("guest-room").onclick  = () => { SFX.tap(); createRoom(); };

/* 방 참여는 이 폰 주인의 허락이 필요 없다 — 게스트 폰에서 누르는 버튼이고,
   방을 여는 쪽(주인)이 이미 허락한 자리다 */
$("go-join").onclick = () => { SFX.tap(); openPin("room", joinRoom); };
$("room-back").onclick = () => { SFX.tap(); netLeave(); paintHomeEnergy(); show("home"); };

$("m-quit").onclick  = openQuit;
$("h-quit").onclick  = openQuit;
$("quit-no").onclick = closeQuit;
$("quit-yes").onclick = () => { SFX.tap(); quitMatch(); };

$("energy-close").onclick   = closeEnergy;
$("energy-records").onclick = () => { closeEnergy(); buildRecords(); };

$("res-again").onclick   = () => { SFX.tap(); playAgain(); };
/* 기록 삭제는 되돌릴 수 없다. 전적과 서열이 이 게임의 지속 동력이므로
   잘못 누른 한 번으로 사라지면 안 된다 — 두 번 눌러야 지워진다. */
let clearArmTimer = null;
function disarmClear(){
  if(clearArmTimer){ clearTimeout(clearArmTimer); clearArmTimer = null; }
  const b = $("rec-clear");
  b.textContent = "기록 모두 지우기";
  b.classList.remove("danger");
}
$("rec-clear").onclick = () => {
  const b = $("rec-clear");
  if(!clearArmTimer){
    SFX.tap();
    b.textContent = "정말 지울까요? 한 번 더 누르면 삭제";
    b.classList.add("danger");
    clearArmTimer = setTimeout(disarmClear, 4000);   // 가만히 두면 저절로 취소된다
    return;
  }
  disarmClear();
  store.solo = defaultStore().solo;
  store.guest = defaultStore().guest;
  saveStore();
  buildRecords();
};

function paintToggles(){
  $("t-sound").classList.toggle("off", !store.sound);
  $("t-vib").classList.toggle("off", !store.vib);
  $("t-sound").textContent = (store.sound ? "🔊" : "🔇") + " 소리";
  $("t-vib").textContent   = (store.vib ? "📳" : "📴") + " 진동";
}
$("t-sound").onclick = () => { store.sound = !store.sound; saveStore(); paintToggles(); SFX.tap(); };
$("t-vib").onclick   = () => { store.vib = !store.vib; saveStore(); paintToggles(); buzz(40); };
paintToggles();
paintGauge();
paintHomeEnergy();
</script>
